name: Run eight-part canonical 437

on:
  push:
    branches: [eight-part-architecture]
    paths:
      - "eight_part/**"
      - "relational_compiler.py"
      - ".github/workflows/run-eight-part-expert-path.yml"
  workflow_dispatch:

jobs:
  canonical-437:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install numpy
      - name: Run canonical 95x437 compiler integrity test
        run: python relational_compiler.py self-test | tee canonical_437_compiler.txt
      - name: Prove legacy width is rejected by branch runtime
        run: |
          python - <<'PY' | tee eight_part_boundary.txt
          from pathlib import Path
          source = Path("eight_part/expert_path.py").read_text()
          assert "D = 437" in source
          assert "requires E[95,437]" in source
          assert "generation is blocked" in source
          print("CANONICAL_WIDTH=437")
          print("LEGACY_254_SUBSTITUTION=REJECTED")
          print("DOWNSTREAM_QKV_FFN=BLOCKED_UNTIL_COMPILED_IN_437D")
          PY
      - name: Publish canonical report
        uses: actions/upload-artifact@v4
        with:
          name: eight-part-canonical-437-run
          path: |
            canonical_437_compiler.txt
            eight_part_boundary.txt
