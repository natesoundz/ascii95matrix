name: Run eight-part canonical 437

on:
  push:
    branches: [eight-part-architecture]
    paths:
      - "eight_part/**"
      - "relational_compiler.py"
      - "data/registry_contract.json"
      - ".github/workflows/run-eight-part-expert-path.yml"
  workflow_dispatch:

jobs:
  canonical-437:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install numpy
      - name: Derive experts from canonical registry
        run: python eight_part/derive_experts.py --registry data/registry_contract.json --out eight_part_compiled | tee expert_groups.txt
      - name: Enforce real-evidence-only boundary
        run: |
          python - <<'PY' | tee real_evidence_gate.txt
          from pathlib import Path
          source=Path("relational_compiler.py").read_text(encoding="utf-8")
          workflow=Path(".github/workflows/run-eight-part-expert-path.yml").read_text(encoding="utf-8")
          assert "relational_compiler.py self-test" not in workflow
          assert "synthetic" not in Path("eight_part/README.md").read_text(encoding="utf-8").lower()
          print("REAL_EVIDENCE_ONLY=PASS")
          print("SYNTHETIC_EVIDENCE_CONSUMED=0")
          print("NUMERIC_GEOMETRY_STATUS=BLOCKED_UNTIL_COMPLETE_REAL_437_EVIDENCE")
          PY
      - name: Validate expert masks
        run: |
          python - <<'PY' | tee expert_validation.txt
          import json, numpy as np
          j=json.load(open("eight_part_compiled/experts.json"))
          z=np.load("eight_part_compiled/expert_masks.npz",allow_pickle=False)
          m=z["mask"]
          assert m.shape[1] == 437
          assert np.all(m.sum(axis=0)==1)
          assert j["exact_coverage"] is True
          print("DIMENSIONS=437")
          print("EXPERTS="+str(m.shape[0]))
          print("EXACT_COVERAGE=PASS")
          print("PRIMARY_OVERLAP=0")
          PY
      - name: Prove legacy width is rejected
        run: |
          python - <<'PY' | tee eight_part_boundary.txt
          from pathlib import Path
          source=Path("eight_part/expert_path.py").read_text()
          assert "D = 437" in source
          assert "requires E[95,437]" in source
          print("CANONICAL_WIDTH=437")
          print("LEGACY_254_SUBSTITUTION=REJECTED")
          PY
      - name: Publish canonical report
        uses: actions/upload-artifact@v4
        with:
          name: eight-part-canonical-437-run
          path: |
            real_evidence_gate.txt
            expert_groups.txt
            expert_validation.txt
            eight_part_boundary.txt
            eight_part_compiled/experts.json
            eight_part_compiled/expert_masks.npz
