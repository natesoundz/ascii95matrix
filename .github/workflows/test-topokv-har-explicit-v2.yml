name: test explicit TopoKV HAR v2
on:
  workflow_dispatch:
  push:
    branches: [topokv-har-explicit-control-v2]
    paths:
      - 'experiments/topokv_har_explicit_control_v2.py'
      - 'experiments/test_topokv_har_explicit_control_v2.py'
      - 'experiments/run_topokv_har_explicit_v2.py'
      - '.github/workflows/test-topokv-har-explicit-v2.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-torch.txt
      - run: python -m unittest experiments.test_topokv_har_explicit_control_v2 -v
